name: Atualizar consulta de estoque

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Enable only after automated collection is authorized for this project.
    if: vars.VIVVER_COLLECTION_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collection dependency
        run: python -m pip install requests

      - name: Collect and validate source data
        id: collect
        continue-on-error: true
        run: python -m src.extract.collector

      - name: Check freshness and send an alert
        if: always()
        env:
          COLLECTION_ALERT_WEBHOOK_URL: ${{ secrets.COLLECTION_ALERT_WEBHOOK_URL }}
        run: python -m src.monitoring

      - name: Publish the updated snapshot
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/public_snapshot.json
          if git diff --cached --quiet; then
            echo "O snapshot não mudou; nenhum commit será criado."
          else
            git commit -m "chore: update stock snapshot"
            git push
          fi
